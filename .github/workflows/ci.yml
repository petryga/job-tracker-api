name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Lint + test
    runs-on: ubuntu-latest
    env:
      AUTH_DISABLED: "true" # SUPABASE_URL unset; tests mock jose regardless
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
